<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Huella de Lectura</title>
  <link rel="stylesheet" href="static/style.css">
</head>

<body>

  <header>
    <img src="./static/Imagenes/huella.webp" alt="Logo huella">
    <h1>Bienvenido/a a tu Huella de Lectura</h1>
    <p>Aquí podrás organizar y cargar tus libros leídos.</p>
    <p>Visitá <a href="/libros">libros</a> para ver los productos en JSON.</p>
  </header>

  	<h2>Agregar Libro</h2>
		<form id="formulario-libro">

		<label>Titulo:</label>
		<input type="text" id="titulo" name="titulo" required> 
		<br><br>

    <label for="autor">Autor:</label>
    <input type="text" id="autor" name="autor" required>
		<br><br>

    <label for="anioPublicacion">Año de Publicación:</label>
        <input type="number" id="anioPublicacion" name="anioPublicacion" min="860" max="2025" required>
		<br>

		<label>Valoración:</label>
        <p class="clasificacion">
            <input id="star-5" type="radio" name="valoracion" value="5" required>
            <label for="star-5" title="5 estrellas">★</label>
            <input id="star-4" type="radio" name="valoracion" value="4">
            <label for="star-4" title="4 estrellas">★</label>
            <input id="star-3" type="radio" name="valoracion" value="3">
            <label for="star-3" title="3 estrellas">★</label>
            <input id="star-2" type="radio" name="valoracion" value="2">
            <label for="star-2" title="2 estrellas">★</label>
            <input id="star-1" type="radio" name="valoracion" value="1">
            <label for="star-1" title="1 estrella">★</label>
        </p>
		<br>

    <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" cols="50" rows="3"></textarea>
		<br><br>

    <label for="autor">Genero:</label>
    <input type="text" id="genero" name="genero" required>
		<br><br>

		<button id="boton-agregar" type="submit">Agregar</button></form>

    </form>
    

    <h2>Lista de Libros</h2>
    <!-- Contenedor para mostrar la lista de libros -->
    <button id="boton-listar" class="btn">Listar libros</button>
    <div id="lista-libros">
      <!-- Aquí JavaScript agregará los libros -->
    </div>

    <script src="./app.js"></script>
</body>
</html>
